/* ---------- unlock ---------- */
function b64(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function decrypt(pw) {
  const raw = b64(PAYLOAD), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFKC").trim()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" }, base,
                                            { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  const text = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(text);
}
function store(op, v) { try { return op === "get" ? localStorage.getItem(KEY) : op === "set" ? localStorage.setItem(KEY, v) : localStorage.removeItem(KEY); } catch (e) { return null; } }
function gateError(text) {
  const err = $("#pw-error");
  err.textContent = text ? "＊" + text : ""; err.hidden = !text;
  if (text) $("#pw").setAttribute("aria-invalid", "true"); else $("#pw").removeAttribute("aria-invalid");
}

async function boot() {
  if (!SAMPLE) document.querySelectorAll("[data-sample]").forEach(e => e.remove());
  if (PLAIN) return start(PLAIN);
  const gate = $("#gate");
  if (!(window.crypto && crypto.subtle) || typeof DecompressionStream === "undefined") {
    gate.hidden = false; gateError("このブラウザでは開けません。最新の Safari か Chrome でお試しください。"); $("#open").disabled = true; return;
  }
  const saved = store("get");
  if (saved) {
    try { return start(await decrypt(saved)); } catch (e) { store("del"); gateError("合言葉が新しくなりました。メンバー限定の投稿をご確認ください。"); }
  }
  gate.hidden = false;
  $("#gate-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const pw = $("#pw").value, btn = $("#open");
    btn.disabled = true; btn.textContent = "開いています…"; gateError("");
    try {
      const data = await decrypt(pw);
      if ($("#remember").checked) store("set", pw.normalize("NFKC").trim());
      gate.hidden = true; start(data);
    } catch (e) {
      gateError("合言葉が違います。");
    }
    btn.disabled = false; btn.textContent = "開く";
  });
}

/* ---------- helpers ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
/* titles and headings: wrap only between phrases (cut by the builder with BudouX, DATA.brk), search terms marked */
function ph(text, ts) {
  const cuts = new Set(DATA.brk[text] || []), r = ts && ts.length ? ranges(text, ts) : [];
  let o = "", j = 0;
  for (let i = 0; i < text.length; i++) {
    if (cuts.has(i)) o += "<wbr>";
    if (j < r.length && i === r[j][0]) o += markTag(r[j][1] - r[j][0]);
    o += esc(text[i]);
    if (j < r.length && i + 1 === r[j][1]) { o += "</mark>"; j++; }
  }
  return '<span class="l-ph">' + o + "</span>";
}
function fmt(t) { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
function yt(src, t) { return "https://www.youtube.com/watch?v=" + src.video + (t ? "&t=" + Math.floor(t) + "s" : ""); }
function jdate(iso) { const [y, m, d] = iso.split("-").map(Number); return m + "月" + d + "日（" + WD[new Date(y, m - 1, d).getDay()] + "）"; }
function time(src, t) {
  return '<a class="dads-link l-time" href="' + yt(src, t) + '" target="_blank" rel="noopener" aria-label="動画の ' + fmt(t) + ' から再生（YouTube が開きます）">' + fmt(t) + "</a>";
}
function kindOf(sec) { return sec.src.kind === "qa" ? "qa" : sec.question ? "box" : "pod"; }
function chip(k) { return '<span class="dads-chip-label" data-style="filled-1" data-color="' + KIND[k][0] + '">' + KIND[k][1] + "</span>"; }
function themeChips(tags) {
  return tags && tags.length ? '<p class="l-chips">' + tags.map(t => '<span class="dads-chip-label" data-style="outlined" data-color="gray">' + esc(t) + "</span>").join("") + "</p>" : "";
}
function mins(sec) { const m = Math.round((sec.end - (sec.a_t ?? sec.t)) / 60); return m < 1 ? "1分弱" : "約" + m + "分"; }
function crumbs(items) {
  const sep = '<span class="dads-breadcrumb__separator"><svg class="dads-breadcrumb__separator-icon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 11L4 10.5L8 6.5L4 2.5L4.5 2L9 6.5L4.5 11Z" fill="currentcolor"/></svg></span>';
  return '<nav class="dads-breadcrumb l-crumbs" aria-label="現在位置"><p class="dads-breadcrumb__list">' + items.map(([label, href], i) =>
    i < items.length - 1 ? '<span class="dads-breadcrumb__item"><a class="dads-breadcrumb__link" href="' + href + '">' + esc(label) + "</a>" + sep + "</span>"
                         : '<span class="dads-breadcrumb__item" aria-current="page">' + ph(label) + "</span>").join("") + "</p></nav>";
}
function playButton(href, label) {
  return '<div class="l-actions"><a class="dads-button" data-type="solid-fill" data-size="lg" href="' + href + '" target="_blank" rel="noopener">' + label + EXT + "</a></div>";
}

/* search: fold katakana to hiragana, full-width to half-width, upper to lower; one UTF-16 unit each, so indexes stay valid */
function fold(s) {
  let o = "";
  for (let i = 0; i < s.length; i++) {
    let c = s.charCodeAt(i);
    if (c >= 0x30a1 && c <= 0x30f6) c -= 0x60;
    else if (c >= 0xff01 && c <= 0xff5e) c -= 0xfee0;
    else if (c === 0x3000) c = 0x20;
    o += String.fromCharCode(c);

}

function ranges(text, ts) {
  const f = fold(text), r = [];
  for (const t of ts) { let i = f.indexOf(t); while (i >= 0) { r.push([i, i + t.length]); i = f.indexOf(t, i + t.length); } }
  r.sort((a, b) => a[0] - b[0]);
  const m = [];
  for (const x of r) { if (m.length && x[0] <= m[m.length - 1][1]) m[m.length - 1][1] = Math.max(m[m.length - 1][1], x[1]); else m.push(x.slice()); }
  return m;
}
function markTag(n) { return n <= 8 ? '<mark class="l-nw">' : "<mark>"; }   // a short search term is not split over two lines
function mark(text, ts) {
  if (!ts || !ts.length) return esc(text);
  let o = "", p = 0;
  for (const [a, b] of ranges(text, ts)) { o += esc(text.slice(p, a)) + markTag(b - a) + esc(text.slice(a, b)) + "</mark>"; p = b; }
  return o + esc(text.slice(p));
}
function snippet(text, ts, w = 46) {
  const r = ranges(text, ts);
  if (!r.length) return esc(text.slice(0, w * 2)) + (text.length > w * 2 ? "…" : "");
  const a = Math.max(0, r[0][0] - w), b = Math.min(text.length, r[0][1] + w);
  return (a > 0 ? "…" : "") + mark(text.slice(a, b), ts) + (b < text.length ? "…" : "");
}

/* ---------- data ---------- */
function start(data) {
  DATA = data; SECS = []; QAS = [];
  for (const src of data.sources) {
    src.sections.forEach((s, k) => {
      s.src = src; s.k = k; s.id = src.id + "-" + (k + 1);
      s.end = k + 1 < src.sections.length ? src.sections[k + 1].t : src.duration;
      s.qtext = s.letter ? s.letter.paragraphs.join("") : s.question;
      s.hay = fold([s.heading, s.title, s.qtext, (s.points || []).join(" "), (s.tags || []).join(" "),
                    s.paragraphs.map(p => p.text).join(" ")].filter(Boolean).join(" "));
      SECS.push(s);
      if (s.question) QAS.push(s);
    });
  }
  $("#built").textContent = "（" + data.built + " 更新）";
  if (data.brand) {
    const t = $("#brand-tag"); t.textContent = data.brand.tag.replace("」", "」\u200b"); t.hidden = false;   // narrow phones: wrap after 」
    $("#brand-name").textContent = data.brand.name; $("#brand-sub").textContent = data.brand.sub;
    document.title = data.brand.sub + "｜" + data.brand.name;
  }
  const lock = $("#lock");
  if (!PLAIN) { lock.hidden = false; lock.addEventListener("click", () => { store("del"); location.hash = ""; location.reload(); }); }
  const q = $("#q");
  let timer = null;
  const go = () => {                       // one history entry per search, not per keystroke
    const v = q.value.trim(), nh = v ? "#/search/" + encodeURIComponent(v) : "#/qa";
    if (location.hash.startsWith("#/search/")) { history.replaceState(null, "", nh); route(); } else location.hash = nh;
  };
  q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(go, 300); });
  $("#search").addEventListener("submit", ev => { ev.preventDefault(); clearTimeout(timer); go(); q.blur(); });
  window.addEventListener("hashchange", route);
  $("#app").hidden = false;
  route();
}

/* ---------- views ---------- */
function filter(list, label) {
  const used = new Set();
  list.forEach(x => (x.tags || []).forEach(t => used.add(t)));
  const opts = DATA.tags.filter(t => used.has(t));
  return '<div class="l-filter"><label for="theme">テーマ</label><span class="dads-select"><span class="dads-select__control">' +
    '<select id="theme" class="dads-select__select" data-size="sm"><option value="">すべて（' + label + "）</option>" +
    opts.map(t => '<option value="' + esc(t) + '"' + (t === tag ? " selected" : "") + ">" + esc(t) + "</option>").join("") +
    '</select><svg class="dads-select__chevron" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17L3 8L4 7L12 15L20 7L21 8L12 17Z" fill="currentcolor"/></svg></span></span></div>';
}
function bindFilter(v) { const s = $("#theme", v); if (s) s.addEventListener("change", () => { tag = s.value; route(); }); }
function item(href, title, label, support) {
  return '<li><div class="dads-resource-list" data-style="frame"><a class="dads-resource-list__body" href="' + href + '"><div class="dads-resource-list__contents">' +
    '<h2 class="dads-resource-list__title">' + title + '</h2><div class="dads-resource-list__label">' + label + '</div><div class="dads-resource-list__support">' + support +
    "</div></div></a></div></li>";
}
function viewQA(v) {
  const list = QAS.filter(s => !tag || (s.tags || []).includes(tag));
  v.innerHTML = filter(QAS, QAS.length + "件") + '<p class="l-lead"><span class="l-ph">水曜の<wbr>メンバー限定Q&Aと、<wbr>音声配信の<wbr>投書箱で<wbr>お答えした<wbr>質問です。<wbr>新しい<wbr>順に<wbr>並んでいます。</span></p>' +
    '<ul class="l-items">' + list.map(s => item("#/qa/" + s.id, ph(s.title), '<p class="l-meta">' + chip(kindOf(s)) + "<span>" + jdate(s.src.date) + "</span></p>",
      '<p class="l-clamp">' + esc(s.qtext) + "</p>" + themeChips(s.tags))).join("") + "</ul>";
  bindFilter(v);
}
function viewEpisodes(v) {
  const list = DATA.sources.filter(src => !tag || src.sections.some(s => (s.tags || []).includes(tag)));
  v.innerHTML = filter(SECS, DATA.sources.length + "回") + '<p class="l-lead"><span class="l-ph">音声配信と<wbr>水曜の<wbr>メンバー限定Q&Aの、<wbr>すべての回です。<wbr>開くと、<wbr>目次と<wbr>原稿<wbr>（全文）が<wbr>読めます。</span></p>' +
    '<ul class="l-items">' + list.map(src => item("#/ep/" + src.id, ph(src.short),
      '<p class="l-meta">' + chip(src.kind === "qa" ? "qa" : "pod") + "<span>" + jdate(src.date) + "</span><span>" + fmt(src.duration) + "</span></p>",
      (src.sub ? '<p class="l-from">' + ph(src.sub) + "</p>" : "") +
      '<ul class="l-summary">' + src.summary.map(x => "<li>" + ph(x) + "</li>").join("") + "</ul>")).join("") + "</ul>";
  bindFilter(v);
}
function hlNote() {
  return hl.length ? '<p class="l-hl"><span>「' + esc(hlq) + '」に<mark>色</mark>を付けています。</span><button id="hl-off" class="dads-button" type="button" data-type="text" data-size="xs">色を消す</button></p>' : "";
}
function bindHl(v) { const b = $("#hl-off", v); if (b) b.addEventListener("click", () => { hl = []; hlq = ""; route(); }); }
function qbox(s) {   // the member's own words from the 投書箱 when we have them, else the question as read on air
  if (!s.letter) return '<blockquote class="dads-blockquote l-qbox"><p>' + mark(s.question, hl) + "</p></blockquote>";
  const [, m, d] = s.letter.date.split("-").map(Number);
  return '<p class="l-qnote">' + m + "月" + d + "日に投書箱に届いた質問（テーマ：" + esc(s.letter.theme) + "）</p>" +
    '<blockquote class="dads-blockquote l-qbox">' + s.letter.paragraphs.map(x => "<p>" + mark(x, hl) + "</p>").join("") + "</blockquote>";
}
function paras(s) {
  return '<div class="l-body dads-u-std-17N-170">' + s.paragraphs.map(p => p.who === "host"
    ? '<p class="l-host">' + time(s.src, p.t) + '<span class="l-who">司会</span>' + mark(p.text, hl) + "</p>"
    : "<p>" + time(s.src, p.t) + mark(p.text, hl) + "</p>").join("") + "</div>";
}
function viewArticle(v, id) {
  const s = QAS.find(x => x.id === id);
  if (!s) return viewQA(v);
  const src = s.src, others = QAS.filter(x => x.src === src && x !== s), at = s.a_t ?? s.t;
  v.innerHTML = crumbs([["会員ライブラリ", "#/qa"], ["質問と回答", "#/qa"], [s.title, ""]]) + hlNote() +
    '<article><hgroup class="dads-heading" data-size="24"><p class="dads-heading__shoulder">' + jdate(src.date) + "　" + KIND[kindOf(s)][1] +
    '</p><h1 class="dads-heading__heading">' + ph(s.title, hl) + "</h1></hgroup>" + themeChips(s.tags) +
    '<h2 class="dads-heading l-h2" data-size="20" data-chip>質問</h2>' + qbox(s) +
    (s.points && s.points.length ? '<h2 class="dads-heading l-h2" data-size="20" data-chip>回答の要点</h2><ul class="dads-list" data-spacing="8">' +
      s.points.map(x => "<li>" + ph(x, hl) + "</li>").join("") + "</ul>" : "") +
    playButton(yt(src, at), "動画で見る（" + fmt(at) + " から）") +
    '<h2 class="dads-heading l-h2" data-size="20" data-chip>回答（' + mins(s) + "）</h2>" + paras(s) +
    '<nav class="l-more" aria-labelledby="more-h"><h2 id="more-h" class="dads-heading l-h2" data-size="20" data-chip>この回のほかの質問</h2><ul class="dads-list" data-spacing="8">' +
    others.map(x => '<li><a class="dads-link" href="#/qa/' + x.id + '">' + ph(x.title) + "</a></li>").join("") +
    '<li><a class="dads-link" href="#/ep/' + src.id + '">この回の原稿をすべて読む（' + ph(src.short) + "）</a></li></ul></nav></article>";
  bindHl(v);
}
function viewEpisode(v, id, k) {
  const src = DATA.sources.find(x => x.id === id);
  if (!src) return viewEpisodes(v);
  const pod = src.kind !== "qa";
  v.innerHTML = crumbs([["会員ライブラリ", "#/qa"], ["回の一覧", "#/ep"], [src.short, ""]]) + hlNote() +
    '<article><hgroup class="dads-heading" data-size="24"><p class="dads-heading__shoulder">' + jdate(src.date) + "　" + (pod ? "音声配信" : "水曜のメンバー限定Q&A") +
    "　" + fmt(src.duration) + '</p><h1 class="dads-heading__heading">' + ph(src.short) + "</h1></hgroup>" +
    (src.sub ? '<p class="l-sub">' + ph(src.sub) + "</p>" : "") +
    '<h2 class="dads-heading l-h2" data-size="20" data-chip>この回の要点</h2><ul class="dads-list" data-spacing="8">' +
    src.summary.map(x => "<li>" + ph(x) + "</li>").join("") + "</ul>" +
    playButton(yt(src), pod ? "YouTube で聴く" : "YouTube で見る") +
    '<nav class="dads-toc" aria-labelledby="toc-h"><h2 id="toc-h" class="dads-toc__heading">目次</h2><ul class="dads-list" data-spacing="8">' +
    src.sections.map(s => '<li><a class="dads-link" href="#/ep/' + src.id + "/" + (s.k + 1) + '">' + ph(s.heading) + "</a>（" + fmt(s.t) + "）</li>").join("") + "</ul></nav>" +
    src.sections.map(s => '<section class="l-section" id="s' + (s.k + 1) + '"><h2 class="dads-heading l-h2" data-size="24" data-rule="2">' + ph(s.heading) + "</h2>" +
      (s.question ? '<h3 class="dads-heading l-h3" data-size="18">' + ph(s.title, hl) + "</h3>" + qbox(s) +
                    '<p><a class="dads-link" href="#/qa/' + s.id + '">記事のページで読む</a></p>' : "") + paras(s) + "</section>").join("") + "</article>";
  bindHl(v);
  if (k) { const el = $("#s" + k, v); if (el) setTimeout(() => el.scrollIntoView(), 0); }
}
function viewSearch(v, q) {
  const ts = terms(q);
  hl = ts; hlq = q.trim();
  const hits = SECS.filter(s => ts.every(t => s.hay.includes(t)));
  const nq = hits.filter(s => s.question).length;
  v.innerHTML = '<h1 class="dads-heading l-count" data-size="20">「' + esc(q) + "」の検索結果</h1><p class=\"l-lead\">質問と回答 " + nq + " 件・原稿 " + (hits.length - nq) + " か所</p>" +
    (hits.length ? '<ul class="l-items">' + hits.map(s => {
      const ps = s.paragraphs.filter(p => ts.some(t => fold(p.text).includes(t))).slice(0, 3);
      const head = s.question ? s.title : s.heading;
      const href = s.question ? "#/qa/" + s.id : "#/ep/" + s.src.id + "/" + (s.k + 1);
      return '<li><div class="dads-resource-list" data-style="frame"><div class="dads-resource-list__body"><div class="dads-resource-list__contents">' +
        '<h2 class="dads-resource-list__title"><a href="' + href + '">' + ph(head, ts) + '</a></h2><div class="dads-resource-list__label"><p class="l-meta">' +
        chip(kindOf(s)) + "<span>" + jdate(s.src.date) + '</span></p></div><div class="dads-resource-list__support"><p class="l-from">「' + ph(s.src.short) + "」より</p>" +
        (s.question && ts.some(t => fold(s.qtext).includes(t)) ? '<p class="l-snip"><span class="l-who">質問</span>' + snippet(s.qtext, ts) + "</p>" : "") +
        ps.map(p => '<p class="l-snip">' + time(s.src, p.t) + snippet(p.text, ts) + "</p>").join("") + "</div></div></div></div></li>";
    }).join("") + "</ul>" : '<p class="l-empty"><span class="l-ph">見つかりませんでした。<wbr>言葉を<wbr>短く<wbr>するか、<wbr>ひらがなでも<wbr>お試しください。</span></p>');
}
function viewWeek(v) {
  v.innerHTML = DATA.weeks.map(w => '<section class="l-week"><h1 class="dads-heading" data-size="24" style="margin:0 0 16px">' + ph(w.title) + "</h1>" +
    w.blocks.map(b => b.type === "h" ? '<h2 class="dads-heading l-h3" data-size="18" data-chip>' + ph(b.text) + "</h2>"
      : b.type === "li" ? '<ul class="dads-list" data-spacing="4"><li>' + ph(b.text) + "</li></ul>"
      : b.type === "link" ? '<p><a class="dads-link" href="' + esc(b.url) + '" target="_blank" rel="noopener">この回を YouTube で聴く</a></p>'
      : "<p>" + esc(b.text) + "</p>").join("") + "</section>").join("");
}
function route() {
  let h = location.hash.slice(1) || "/qa";
  try { h = decodeURIComponent(h); } catch (e) { /* keep as is */ }
  const parts = h.split("/").filter(Boolean), v = $("#view");
  if (!parts[1] || parts[0] === "week") { hl = []; hlq = ""; }          // lists: no marks
  const tabName = parts[0] === "search" ? "" : parts[0] || "qa";
  document.querySelectorAll(".dads-tab__tab").forEach(a => { if (a.dataset.tab === tabName) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const q = $("#q");
  if (parts[0] !== "search" && document.activeElement !== q) q.value = "";
  if (parts[0] === "qa" && parts[1]) viewArticle(v, parts[1]);
  else if (parts[0] === "ep" && parts[1]) viewEpisode(v, parts[1], parts[2]);
  else if (parts[0] === "ep") viewEpisodes(v);
  else if (parts[0] === "week") viewWeek(v);
  else if (parts[0] === "search" && parts[1]) { const s = parts.slice(1).join("/"); if (q.value.trim() !== s) q.value = s; viewSearch(v, s); }
  else viewQA(v);
  if (!(parts[0] === "ep" && parts[2])) window.scrollTo(0, 0);
}
boot();
</script>
